name: Android Build CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: List files (debug)
        run: |
          echo "=== 项目根目录 ==="
          ls -la
          echo ""
          echo "=== gradle/wrapper ==="
          ls -la gradle/wrapper/ 2>/dev/null || echo "目录不存在"
          echo ""
          echo "=== app/src ==="
          find app/src -type f | head -50

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Fix gradlew format and permissions
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dos2unix gradle
          if [ -f "gradlew" ]; then
            dos2unix gradlew
            chmod +x gradlew
            echo "gradlew 已修复格式并赋予执行权限"
          else
            echo "gradlew 不存在，用 gradle wrapper 生成"
            gradle wrapper --gradle-version 8.2
          fi
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "gradle-wrapper.jar 不存在，重新生成"
            gradle wrapper --gradle-version 8.2
          fi
          ls -la gradle/wrapper/

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build_log.txt
          echo "=== 构建结果 ==="
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "APK 构建成功!"
            ls -lh app/build/outputs/apk/debug/app-debug.apk
          else
            echo "APK 构建失败，显示错误日志最后100行:"
            tail -100 build_log.txt
            exit 1
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload build log (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt
